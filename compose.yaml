services:
  capstone.web:
    image: capstoneweb
    container_name: capstone_web
    ports:
      - 9090:8080
    build:
      context: .
      dockerfile: Capstone.Web/Dockerfile
  capstone.collector:
    image: capstonecollector
    container_name: capstone_collector
    ports:
      - 9091:8080
    env_file:
      - Capstone.Collector/.env
    build:
      context: .
      dockerfile: Capstone.Collector/Dockerfile
  capstone.api:
    image: capstoneapi
    container_name: capstone_api
    ports:
      - 9092:8080
    env_file:
      - Capstone.API/.env
    build:
      context: .
      dockerfile: Capstone.API/Dockerfile