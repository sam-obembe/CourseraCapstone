alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
features:
  - buildpack-stack=ubuntu-22
ingress:
  rules:
    - component:
        name: courseracapstone-capstone-web
      match:
        path:
          prefix: /
name: capstone-app
region: nyc
services:
  - dockerfile_path: Dockerfile_Web
    github:
      branch: main
      repo: sam-obembe/CourseraCapstone
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    name: courseracapstone-capstone-web
    source_dir: /
